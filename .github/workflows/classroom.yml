name: Autograding Tests
on:
  push:
    branches:
      - main         
  pull_request:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: pytest custom
      id: pytest-custom
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: pytest custom
        setup-command: cd tlengrep && sudo -H pip3 install -r requirements.txt
        command: cd tlengrep && pytest -k test_regex.py
        timeout: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        PYTEST-CUSTOM_RESULTS: "${{steps.pytest-custom.outputs.result}}"
      with:
        runners: pytest-custom